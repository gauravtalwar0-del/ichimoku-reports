<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title>
<style>body{font-family:Arial,sans-serif;background:#f4f5f7;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
form{background:#fff;padding:28px 32px;border-radius:8px;box-shadow:0 2px 10px #0002;width:280px}h2{margin-top:0}
input{width:100%;box-sizing:border-box;padding:8px;margin:6px 0 12px;font-size:15px}button{width:100%;padding:9px;font-size:15px;cursor:pointer}
#e{color:#b3261e;font-size:13px;min-height:18px}</style></head><body>
<form id="f"><h2>Ichimoku backtest reports</h2><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><div id="e"></div><button>Log in</button></form>
<script>
const H="32cd3361537bb485ada1aa89457a91401bafde3fe945e1217c0fadba4ff460be";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();
 const h=await sha(document.getElementById("u").value.trim()+":"+document.getElementById("p").value);
 if(h===H){sessionStorage.setItem("ichi_ok","1");location.href="runs.html";}else{document.getElementById("e").textContent="Wrong username or password.";}});
</script></body></html>
